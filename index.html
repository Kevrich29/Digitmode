<script>(function(){function show(m){var a=document.getElementById('app');if(!a)return document.addEventListener('DOMContentLoaded',function(){show(m)});a.innerHTML='<div class="card warn"><h2>L\'app non riesce a partire</h2><p class="mu"></p></div>';a.querySelector('p').textContent=m}addEventListener('error',function(e){var t=e.target;if(t&&t.tagName){if(t.tagName!=='SCRIPT'&&t.tagName!=='LINK')return;show('Non riesco a caricare "'+String(t.src||t.href).split('/').pop()+'". Tieni index.html, style.css, script.js e logo.png nella stessa cartella con questi nomi esatti, oppure apri Digitmode.html (file unico).')}else show('Errore: '+e.message)},true)})()</script>
